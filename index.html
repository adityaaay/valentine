<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>💌 Valentine?</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="bg-hearts" id="bgHearts" aria-hidden="true"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="card" role="main">
    <img
      class="gif"
      id="gif"
      src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
      alt="Cute animated gif"
      loading="lazy"
    />

    <h1 id="title">Will you be my Valentine? 💘</h1>
    <p id="subtitle">Be honest… but choose wisely 😌</p>

    <div id="countdown" class="countdown" aria-live="polite"></div>

    <div class="btns">
      <button id="yes">Yes! 💖</button>
      <button id="no">No 🙃</button>
    </div>

    <div class="msg" id="msg">YAYYY!! 🥰</div>

    <section id="afterYes" class="after-yes" aria-live="polite">
      <p class="pick">Pick our plan 👇</p>

      <div class="plans">
        <button class="plan" data-plan="Dinner 🍝">Dinner 🍝</button>
        <button class="plan" data-plan="Movie 🎬">Movie 🎬</button>
        <button class="plan" data-plan="Dessert 🍰">Dessert 🍰</button>
        <button class="plan" data-plan="Surprise 😈">Surprise 😈</button>
      </div>

      <p id="finalText" class="final"></p>
    </section>

    <div class="footer">
      Personalized link example:
      <b>?to=Akanksha&from=Aditya</b>
    </div>
  </main>

  <script src="./script.js"></script>
</body>
</html>
