<div class="hearts" id="hearts"></div>

<div class="card">
  <img class="gif" id="gif"
    src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
    alt="cute gif" />

  <h1 id="title">Will you be my Valentine? 💘</h1>
  <p id="subtitle">Be honest… but choose wisely 😌</p>

  <div class="btns" id="btnRow">
    <button id="yes">Yes! 💖</button>
    <button id="no">No 🙃</button>
  </div>

  <div class="msg" id="msg">YAYYY!! 🥰</div>

  <!-- After-Yes options -->
  <div id="afterYes" style="display:none; margin-top:16px;">
    <p style="margin: 0 0 10px; font-weight:700;">Pick our plan 👇</p>
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="plan" data-plan="Dinner 🍝">Dinner 🍝</button>
      <button class="plan" data-plan="Movie 🎬">Movie 🎬</button>
      <button class="plan" data-plan="Dessert 🍰">Dessert 🍰</button>
      <button class="plan" data-plan="Surprise 😈">Surprise 😈</button>
    </div>

    <div style="margin-top:12px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button id="copyMsg" style="background:#111; color:#fff;">Copy message 📋</button>
      <button id="reset" style="background:#fff; border:1px solid #00000012;">Reset 🔄</button>
    </div>

    <p id="finalText" style="margin-top:12px; font-weight:700;"></p>
  </div>

  <div class="footer">Tip: you can send a personalized link like <b>?to=Name&from=Name</b></div>
</div>
