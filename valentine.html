<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>💌 Valentine?</title>
  <style>
    :root { --bg1:#ffdde1; --bg2:#ee9ca7; --card:#ffffffcc; --txt:#1f1f1f; }
    * { box-sizing: border-box; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      color:var(--txt);
      overflow:hidden;
    }
    .card{
      width:min(560px, 92vw);
      padding:28px 22px;
      background:var(--card);
      border:1px solid #ffffff80;
      border-radius:22px;
      text-align:center;
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
      backdrop-filter: blur(10px);
    }
    h1{ margin:10px 0 6px; font-size: clamp(28px, 4vw, 40px); }
    p{ margin: 0 0 14px; opacity:.85; }
    .gif{
      width:min(320px, 70vw);
      aspect-ratio: 1/1;
      border-radius:18px;
      border: 1px solid #00000010;
      box-shadow: 0 10px 25px rgba(0,0,0,.10);
      background:#fff;
      object-fit: cover;
    }
    .btns{
      position:relative;
      margin-top:18px;
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
    }
    button{
      border:0;
      padding:14px 18px;
      border-radius:999px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      transition: transform .08s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active{ transform: scale(.98); }
    #yes{
      background:#ff2e63;
      color:white;
      box-shadow: 0 12px 30px rgba(255,46,99,.35);
    }
    #no{
      background:white;
      color:#333;
      border:1px solid #00000012;
      box-shadow: 0 10px 20px rgba(0,0,0,.08);
      position: relative;
    }
    .msg{
      display:none;
      margin-top:14px;
      font-size:18px;
      font-weight:700;
    }
    .hearts{
      position:fixed; inset:0; pointer-events:none; overflow:hidden;
    }
    .heart{
      position:absolute;
      font-size: 22px;
      animation: floatUp 2.4s ease-in forwards;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,.18));
    }
    @keyframes floatUp{
      from{ transform: translateY(0) scale(1); opacity:1; }
      to{ transform: translateY(-120vh) scale(1.4); opacity:0; }
    }
    .footer{
      margin-top:16px;
      font-size:12px;
      opacity:.65;
    }
    a{ color:#111; }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <div class="card">
    <img class="gif" id="gif"
      src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
      alt="cute gif" />

    <h1 id="title">Will you be my Valentine? 💘</h1>
    <p id="subtitle">Be honest… but choose wisely 😌</p>

    <div class="btns">
      <button id="yes">Yes! 💖</button>
      <button id="no">No 🙃</button>
    </div>

    <div class="msg" id="msg">YAYYY!! 🥰 See you on Valentine’s 😘</div>

    <div class="footer">
      Tip: edit the text + GIF inside the file. Then share as a link.
    </div>
  </div>

  <script>
    const yes = document.getElementById('yes');
    const no = document.getElementById('no');
    const msg = document.getElementById('msg');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const gif = document.getElementById('gif');
    const hearts = document.getElementById('hearts');

    const noTexts = [
      "Are you sure? 😭",
      "Pleaseeee 🥺",
      "Think again 😳",
      "Last chance 😤",
      "Ok but I’ll cry 😔",
      "Stop 😭 just say yes"
    ];
    let noCount = 0;

    function popHearts(n = 18) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      for (let i = 0; i < n; i++) {
        const s = document.createElement('div');
        s.className = 'heart';
        s.textContent = Math.random() > 0.2 ? "💖" : "💘";
        s.style.left = Math.random() * w + "px";
        s.style.top = (h - 20) + "px";
        s.style.fontSize = (18 + Math.random() * 22) + "px";
        s.style.animationDuration = (1.8 + Math.random() * 1.8) + "s";
        hearts.appendChild(s);
        setTimeout(() => s.remove(), 3000);
      }
    }

    // Make "No" run away
    function moveNoButton() {
      const pad = 14;
      const rect = no.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width - pad;
      const maxY = window.innerHeight - rect.height - pad;

      const x = Math.max(pad, Math.random() * maxX);
      const y = Math.max(pad, Math.random() * maxY);

      no.style.position = "fixed";
      no.style.left = x + "px";
      no.style.top = y + "px";
    }

    // On touch devices, use pointerenter + pointerdown
    no.addEventListener('mouseenter', moveNoButton);
    no.addEventListener('pointerdown', () => {
      // change text + make yes grow a bit each time
      no.textContent = noTexts[Math.min(noCount, noTexts.length - 1)];
      noCount++;
      yes.style.transform = `scale(${1 + noCount * 0.08})`;
      moveNoButton();
    });

    yes.addEventListener('click', () => {
      title.textContent = "Hehehe I knew it 😌💞";
      subtitle.textContent = "Now you’re officially my Valentine.";
      msg.style.display = "block";
      gif.src = "https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif";
      popHearts(28);
      // lock the no button
      no.disabled = true;
      no.style.opacity = 0.6;
      no.style.cursor = "not-allowed";
      no.style.position = "relative";
      no.style.left = "auto";
      no.style.top = "auto";
      // optional: redirect after a moment
      // setTimeout(()=>window.location.href="https://instagram.com", 2000);
    });
  </script>
</body>
</html>
